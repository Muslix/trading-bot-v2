# Crypto Trading Bot Log Rotation
/home/muslix/trading_bot_v2/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 644 1000 1000
    postrotate
        # Signal the application to reopen log files if needed
        echo "Log rotated at $(date)" >> /home/muslix/trading_bot_v2/logs/rotation.log
    endscript
}

/home/muslix/trading_bot_v2/logs/*.debug {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 1000 1000
}
