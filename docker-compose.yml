# Docker Compose for Crypto Trading Bot v2.0
version: '3.8'

services:
  crypto-bot:
    build: .
    container_name: crypto-trading-bot-v2
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DATABASE_PATH=/app/data/crypto_trading_bot.db
      - WEB_HOST=0.0.0.0
      - WEB_PORT=5000
      - ENVIRONMENT=${ENVIRONMENT:-production}
    ports:
      - "5000:5000"
    volumes:
      - bot_data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    networks:
      - crypto_bot_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/bot-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: Add monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: crypto-bot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - crypto_bot_network
    profiles:
      - monitoring

  # Optional: Add Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: crypto-bot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - crypto_bot_network
    profiles:
      - monitoring

volumes:
  bot_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  crypto_bot_network:
    driver: bridge
