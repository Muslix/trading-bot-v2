# GitHub Actions CI/CD Pipeline für Crypto Trading Bot
name: 🤖 Crypto Trading Bot CI/CD

on:
  push:
    branches: [ main, develop, production-ready-v2 ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Manual trigger

env:
  PYTHON_VERSION: '3.10'
  
jobs:
  # =============================================================================
  # TESTING & QUALITY CHECKS
  # =============================================================================
  test:
    name: 🧪 Tests & Quality Checks
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: 📦 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black flake8 mypy isort pytest-cov
        
    - name: 🔍 Code Quality Checks
      run: |
        echo "::group::🎨 Code Formatting Check"
        black --check src/ tests/ --line-length=100
        echo "::endgroup::"
        
        echo "::group::📐 Import Sorting Check"
        isort --check-only src/ tests/ --profile black
        echo "::endgroup::"
        
        echo "::group::🔍 Linting"
        flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503
        echo "::endgroup::"
        
        echo "::group::🔎 Type Checking"
        mypy src/ --ignore-missing-imports
        echo "::endgroup::"
        
    - name: 🔒 Security Check
      run: |
        echo "::group::🔒 Security Scan"
        # Check for hardcoded secrets
        if grep -r "BOT_TOKEN.*=" src/ --include="*.py" | grep -E "\"[^\"]+\"|'[^']+'" > /dev/null 2>&1; then
          echo "❌ Hardcoded secrets found!"
          exit 1
        fi
        echo "✅ No hardcoded secrets found"
        echo "::endgroup::"
        
    - name: 🧪 Run Tests
      env:
        # Use test environment variables
        TELEGRAM_BOT_TOKEN: "test_token_placeholder"
        TELEGRAM_CHAT_ID: "123456789"
        DATABASE_PATH: "test_crypto_trading_bot.db"
        WEB_HOST: "127.0.0.1"
        WEB_PORT: "5000"
      run: |
        echo "::group::🧪 Unit Tests"
        python -m pytest tests/test_modules/ -v --tb=short --cov=src/modules --cov-report=xml
        echo "::endgroup::"
        
        echo "::group::🔗 Integration Tests"
        python -m pytest tests/test_integration.py -v --tb=short
        echo "::endgroup::"
        
    - name: 📊 Upload Coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # =============================================================================
  # SECURITY AUDIT
  # =============================================================================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🔒 Security Audit
      run: |
        echo "🔍 Running comprehensive security audit..."
        chmod +x scripts/security_audit.sh
        ./scripts/security_audit.sh
        
    - name: 🕷️ Dependency Vulnerability Scan
      run: |
        pip install safety
        safety check -r requirements.txt

  # =============================================================================
  # BUILD & CONTAINERIZATION
  # =============================================================================
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production-ready-v2'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🔑 Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: 🏗️ Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          muslix/crypto-trading-bot:latest
          muslix/crypto-trading-bot:v2.0
          muslix/crypto-trading-bot:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # =============================================================================
  # DEPLOYMENT
  # =============================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🚀 Deploy to Staging Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          cd /opt/crypto-trading-bot-staging
          git pull origin develop
          docker-compose down
          docker-compose pull
          docker-compose up -d
          
    - name: 🧪 Staging Health Check
      run: |
        sleep 30
        curl -f http://${{ secrets.STAGING_HOST }}:5000/api/bot-health || exit 1

  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🌟 Deploy to Production
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd /opt/crypto-trading-bot
          git pull origin main
          make production-stop
          docker-compose pull
          make production-start
          
    - name: ✅ Production Health Check
      run: |
        sleep 60
        curl -f http://${{ secrets.PROD_HOST }}:5000/api/bot-health || exit 1
        
    - name: 📢 Notify Success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#crypto-bot-alerts'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        message: "🚀 Crypto Trading Bot v2.0 successfully deployed to production!"

  # =============================================================================
  # PERFORMANCE MONITORING
  # =============================================================================
  performance:
    name: 📈 Performance Tests
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 📦 Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install memory-profiler
        
    - name: 📈 Run Performance Benchmarks
      run: |
        echo "🔍 Portfolio Analysis Benchmark:"
        time python -c "from src.modules.portfolio_analyzer import analyze_crypto_portfolio_parallel, get_top_cryptocurrencies; analyze_crypto_portfolio_parallel(get_top_cryptocurrencies(10))"
        
        echo "⚡ Memory Usage Test:"
        python -m memory_profiler src/main.py --test-mode
