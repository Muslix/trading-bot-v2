[tool:pytest]
# Pytest Konfiguration für Crypto Trading Bot v2.0

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Async tests
asyncio_mode = auto

# Markers für verschiedene Test-Kategorien
markers =
    unit: Unit tests für einzelne Funktionen
    integration: Integration tests zwischen Modulen
    performance: Performance tests für Multiprocessing/Async
    slow: Langsame tests die nicht immer ausgeführt werden
    
# Coverage configuration (wenn coverage installiert ist)
# addopts = --cov=modules --cov=utils --cov-report=html --cov-report=term-missing

# Minimum Python version
minversion = 3.8

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning